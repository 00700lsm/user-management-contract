openapi: 3.0.3
info:
  title: User Management PoC API
  version: 0.1.0
  description: >
    공통 FE/BE 계약 초안. Auth / User / Permission 업무 경계를 구분합니다.
    실제 배포/구현 기준은 승인된 Git 커밋 SHA입니다.
servers:
  - url: /api
tags:
  - name: Auth
  - name: User
  - name: Permission
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      responses:
        '204':
          description: 로그아웃 처리 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password/change:
    post:
      tags: [Auth]
      summary: 내 비밀번호 변경
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 변경 완료
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/signup:
    post:
      tags: [User]
      summary: 회원가입 (User 도메인 소유)
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me:
    get:
      tags: [User]
      summary: 내 정보 조회
      operationId: getMyProfile
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [User]
      summary: 내 정보 수정
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /admin/users:
    get:
      tags: [User]
      summary: 관리자 사용자 목록 (이름/이메일 OR 검색, 기본 20건)
      operationId: listUsers
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/UserStatus' }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 목록 조회
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [User]
      summary: 관리자 사용자 등록
      operationId: createUserByAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 사용자 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [User]
      summary: 관리자 사용자 상세
      operationId: getUserByAdmin
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [User]
      summary: 관리자 사용자 정보 수정
      operationId: updateUserByAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [User]
      summary: 사용자 상태 변경 (탈퇴는 WITHDRAWN 처리)
      operationId: updateUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/roles:
    get:
      tags: [Permission]
      summary: 역할 목록 조회
      operationId: listRoles
      responses:
        '200':
          description: 역할 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Permission]
      summary: 사용자 권한 조회
      operationId: getUserRoles
      responses:
        '200':
          description: 권한 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Permission]
      summary: 사용자 권한 변경
      operationId: replaceUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolesRequest'
      responses:
        '200':
          description: 권한 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 중복 사용자
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, WITHDRAWN]
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId: { type: string }
        password: { type: string, format: password }
    TokenResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
    SignupRequest:
      type: object
      required: [loginId, password, email, name]
      properties:
        loginId: { type: string }
        password: { type: string, format: password }
        email: { type: string, format: email }
        name: { type: string }
    UserUpdateRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
    User:
      type: object
      required: [id, loginId, name, email, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        loginId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    Role:
      type: object
      required: [code, name]
      properties:
        code: { type: string, enum: [USER, ADMIN] }
        name: { type: string }
    UserRoles:
      type: object
      required: [userId, roleCodes]
      properties:
        userId: { type: integer, format: int64 }
        roleCodes:
          type: array
          items: { type: string, enum: [USER, ADMIN] }
    UpdateRolesRequest:
      type: object
      required: [roleCodes]
      properties:
        roleCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [USER, ADMIN] }
