openapi: 3.0.3
info:
  title: User Management PoC API
  version: 0.1.0
  description: >
    공통 FE/BE 계약 초안. Auth / User / Permission 업무 경계를 구분합니다.
    실제 배포/구현 기준은 승인된 Git 커밋 SHA입니다.
servers:
  - url: /api
tags:
  - name: Auth
  - name: User
  - name: Permission
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      responses:
        '204':
          description: 로그아웃 처리 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password/change:
    post:
      tags: [Auth]
      summary: 내 비밀번호 변경
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 변경 완료
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/signup:
    post:
      tags: [User]
      summary: 회원가입 (User 도메인 소유)
      operationId: signup
      description: >
        오류(DEC-014): 400 VALIDATION_FAILED(필수값·형식·길이) 또는 PASSWORD_POLICY_VIOLATION(DEC-007), 409 DUPLICATE_LOGIN_ID 또는 DUPLICATE_EMAIL(둘 다 중복이면 DUPLICATE_LOGIN_ID).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me:
    get:
      tags: [User]
      summary: 내 정보 조회
      operationId: getMyProfile
      description: >
        오류: 401 UNAUTHORIZED.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [User]
      summary: 내 정보 수정
      operationId: updateMyProfile
      description: >
        보낸 필드만 변경합니다. 오류(DEC-014): 400 VALIDATION_FAILED(빈 객체·허용 외 필드·형식·길이), 401 UNAUTHORIZED, 409 DUPLICATE_EMAIL(다른 사용자가 쓰는 이메일. 본인의 현재 이메일은 중복이 아님).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users:
    get:
      tags: [User]
      summary: 관리자 사용자 목록 (이름/이메일 OR 검색, 기본 20건)
      operationId: listUsers
      description: >
        오류: 401 UNAUTHORIZED, 403 FORBIDDEN.
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/UserStatus' }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 목록 조회
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [User]
      summary: 관리자 사용자 등록
      operationId: createUserByAdmin
      description: >
        오류(DEC-014): 400 VALIDATION_FAILED 또는 PASSWORD_POLICY_VIOLATION, 401 UNAUTHORIZED, 403 FORBIDDEN, 409 DUPLICATE_LOGIN_ID 또는 DUPLICATE_EMAIL(둘 다 중복이면 DUPLICATE_LOGIN_ID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 사용자 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [User]
      summary: 관리자 사용자 상세
      operationId: getUserByAdmin
      description: >
        오류(DEC-014): 401 UNAUTHORIZED, 403 FORBIDDEN, 404 USER_NOT_FOUND.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [User]
      summary: 관리자 사용자 정보 수정
      operationId: updateUserByAdmin
      description: >
        보낸 필드만 변경합니다. 오류(DEC-014): 400 VALIDATION_FAILED(빈 객체·허용 외 필드·형식·길이), 401 UNAUTHORIZED, 403 FORBIDDEN, 404 USER_NOT_FOUND, 409 DUPLICATE_EMAIL(대상 사용자 본인의 현재 이메일은 중복이 아님).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [User]
      summary: 사용자 상태 변경 (탈퇴는 WITHDRAWN 처리)
      operationId: updateUserStatus
      description: >
        현재와 같은 상태 요청은 200(변경 없음, WITHDRAWN→WITHDRAWN 포함)을 먼저 판정합니다. 오류(DEC-014): 400 VALIDATION_FAILED(status 누락·허용 외 값), 401 UNAUTHORIZED, 403 FORBIDDEN, 404 USER_NOT_FOUND, 409 INVALID_STATUS_TRANSITION(WITHDRAWN→ACTIVE/INACTIVE, DEC-005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: 변경 성공 (현재와 같은 상태 요청도 200, 변경 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/roles:
    get:
      tags: [Permission]
      summary: 역할 목록 조회
      operationId: listRoles
      responses:
        '200':
          description: 역할 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Permission]
      summary: 사용자 권한 조회
      operationId: getUserRoles
      responses:
        '200':
          description: 권한 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Permission]
      summary: 사용자 권한 변경
      operationId: replaceUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolesRequest'
      responses:
        '200':
          description: 권한 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 중복 또는 현재 상태와 충돌 (DUPLICATE_LOGIN_ID, DUPLICATE_EMAIL, INVALID_STATUS_TRANSITION)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: "찾을 수 없음 (code는 operation 설명 참조. 예: User 대상 없음 USER_NOT_FOUND)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, WITHDRAWN]
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            오류 식별 코드(DEC-012). Auth 사용 값:
            UNAUTHORIZED(401, 토큰 없음/무효/만료/폐기), FORBIDDEN(403),
            INVALID_CREDENTIALS(401, 로그인 실패 — 자격증명 오류·비활성 계정·입력 누락을 구분하지 않음),
            INVALID_OLD_PASSWORD(400), PASSWORD_POLICY_VIOLATION(400), VALIDATION_FAILED(400, 그 외 요청 형식 오류).
            공통: NOT_FOUND(404, 매핑되지 않은 경로 등 — 도메인별 대상 미발견은 각 도메인 코드 사용).
            User 사용 값(DEC-014):
            DUPLICATE_LOGIN_ID(409), DUPLICATE_EMAIL(409), USER_NOT_FOUND(404),
            INVALID_STATUS_TRANSITION(409, WITHDRAWN→ACTIVE/INACTIVE. 같은 상태 요청은 200).
            User 입력 형식 오류는 VALIDATION_FAILED(400), 비밀번호 정책 위반은 PASSWORD_POLICY_VIOLATION(400)을 재사용합니다.
            다른 도메인 코드 추가를 막지 않도록 enum으로 제한하지 않습니다.
        message: { type: string }
    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId: { type: string }
        password: { type: string, format: password }
    TokenResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword:
          type: string
          format: password
          minLength: 12
          description: DEC-007 — 12글자 이상, UTF-8 72바이트 이하. 위반 시 400 PASSWORD_POLICY_VIOLATION
    SignupRequest:
      type: object
      required: [loginId, password, email, name]
      properties:
        loginId: { type: string, minLength: 1, maxLength: 80 }
        password:
          type: string
          format: password
          minLength: 12
          description: DEC-007 — 12글자 이상, UTF-8 72바이트 이하. 위반 시 400 PASSWORD_POLICY_VIOLATION
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 120 }
    UserUpdateRequest:
      type: object
      description: >
        name·email만 허용하며 보낸 필드만 변경합니다.
        빈 객체나 허용 외 필드(예: role, status)는 400 VALIDATION_FAILED (DEC-014)
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
    User:
      type: object
      required: [id, loginId, name, email, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        loginId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    Role:
      type: object
      required: [code, name]
      properties:
        code: { type: string, enum: [USER, ADMIN] }
        name: { type: string }
    UserRoles:
      type: object
      required: [userId, roleCodes]
      properties:
        userId: { type: integer, format: int64 }
        roleCodes:
          type: array
          items: { type: string, enum: [USER, ADMIN] }
    UpdateRolesRequest:
      type: object
      required: [roleCodes]
      properties:
        roleCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [USER, ADMIN] }
